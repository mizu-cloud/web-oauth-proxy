services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://app:app-password@db:3306/web_oauth_proxy
      ADMIN_HOST: admin.example.com
      ADMIN_SESSION_SECRET: change-me-admin-session-secret
      APP_ENCRYPTION_KEY: change-me-app-encryption-key
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: web_oauth_proxy
      MYSQL_USER: app
      MYSQL_PASSWORD: app-password
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
